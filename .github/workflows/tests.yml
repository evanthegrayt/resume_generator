name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run linting
        run: ruff check .

      - name: Check generated HTML is current
        run: |
          resume-generator --format html
          git diff --exit-code -- docs/index.html || {
            echo "::error::docs/index.html is stale. Run 'make html' and commit the generated file."
            exit 1
          }

      - name: Smoke test DOCX generation
        run: |
          cat > /tmp/resume.private.toml <<'EOF'
          [contact]
          email = "ci@example.com"
          phone = "555.555.5555"
          EOF
          resume-generator --format docx --no-pdf --contact-file /tmp/resume.private.toml
